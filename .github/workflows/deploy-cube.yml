name: Deploy Cube Semantic Layer

on:
  push:
    branches:
      - main
    paths:
      - 'cube/**'
      - '.github/workflows/deploy-cube.yml'
  workflow_dispatch:

env:
  IMAGE: gcr.io/chaos87/meridian-cube
  SERVICE: meridian-cube
  REGION: us-central1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }} cube/

      - name: Push to Artifact Registry
        run: docker push ${{ env.IMAGE }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --port 4000 \
            --allow-unauthenticated \
            --memory 1Gi \
            --timeout 60 \
            --set-env-vars "CUBEJS_DB_TYPE=postgres,CUBEJS_DB_HOST=${{ secrets.CUBEJS_DB_HOST }},CUBEJS_DB_NAME=${{ secrets.CUBEJS_DB_NAME }},CUBEJS_DB_USER=${{ secrets.CUBEJS_DB_USER }},CUBEJS_DB_PASS=${{ secrets.CUBEJS_DB_PASS }},CUBEJS_DB_SSL=true,CUBEJS_API_SECRET=${{ secrets.CUBEJS_API_SECRET }},CUBEJS_DEV_MODE=false,NODE_ENV=production,CUBEJS_CACHE_AND_QUEUE_DRIVER=memory,CUBEJS_REFRESH_WORKER=false,CUBEJS_PRE_AGGREGATIONS_BUILDER=false,CUBEJS_SCHEDULED_REFRESH_DEFAULT=false,CUBEJS_WEB_SOCKETS=false,CUBEJS_LOG_LEVEL=warn" \
            --quiet

      - name: Get Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format="value(status.url)")
          echo "Cube semantic layer deployed at: $URL"