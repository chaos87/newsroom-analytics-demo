name: dbt daily build

# Nightly schedule DISABLED 2026-09-07: the demo dataset is a complete fixed
# year (365 daily partitions, Apr '25 – Mar '26) and the 3-day reprocessing
# window was the only remaining writer to Neon — it pushed the project to ~91%
# of its 512 MB free-plan storage limit. Reads (dashboard/Cube) are unaffected;
# re-enable by uncommenting the schedule block below.
#   schedule:
#     - cron: "5 3 * * *" # 03:05 UTC daily
on:
  workflow_dispatch: {}

jobs:
  dbt:
    runs-on: ubuntu-latest
    env:
      DBT_HOST: ${{ secrets.DBT_HOST }}
      DBT_USER: ${{ secrets.DBT_USER }}
      DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
      DBT_DBNAME: ${{ secrets.DBT_DBNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-postgres

      - name: Write profiles.yml
        working-directory: ./dbt
        run: |
          cat > profiles.yml <<EOF
          newsroom_analytics:
            target: prod
            outputs:
              prod:
                type: postgres
                host: $DBT_HOST
                port: 5432
                user: $DBT_USER
                password: $DBT_PASSWORD
                dbname: $DBT_DBNAME
                schema: ga4
                threads: 1
                sslmode: require
          EOF

      - name: dbt deps
        working-directory: ./dbt
        run: dbt deps --profiles-dir .

      - name: dbt build
        working-directory: ./dbt
        run: dbt build --profiles-dir . --no-use-colors
        # Incremental by design: the dbt-ga4 daily models reprocess the
        # current_date window (GA4 late-arrival pattern) on every run.

      - name: dbt run summary
        if: always()
        working-directory: ./dbt
        run: tail -n 40 target/run_results.json || true