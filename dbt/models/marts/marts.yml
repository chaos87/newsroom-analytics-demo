version: 2

models:
  - name: fct_newsroom__articles_daily
    description: >
      Daily article performance: GA4 page views, users, scroll, video, social and
      engagement metrics per article, joined to the CMS export (title, section,
      author). One row per (event_date_dt, article_id).
    columns:
      - name: event_date_dt
        tests: [not_null]
      - name: article_id
        tests: [not_null]
      - name: page_views
        tests: [not_null]
  - name: fct_newsroom__articles_daily_by_reader_type
    description: >
      Daily article performance split by reader type — subscriber /
      registered non-subscriber / anonymous — classified from the GA4 user_id
      on each event joined to the CRM export. Subscribers are further split by
      subscription tier ('n/a' for registered / anonymous). One row per
      (event_date_dt, article_id, reader_type, subscription_tier).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - event_date_dt
            - article_id
            - reader_type
            - subscription_tier
    columns:
      - name: event_date_dt
        tests: [not_null]
      - name: article_id
        tests: [not_null]
      - name: reader_type
        tests:
          - not_null
          - accepted_values:
              values: ['subscriber', 'registered', 'anonymous']
      - name: subscription_tier
        tests: [not_null]
      - name: page_views
        tests: [not_null]
  - name: fct_newsroom__traffic_sources_daily
    description: >
      Daily sessions by acquisition channel: GA4 default channel grouping, session
      (first-click) source/medium, and last-non-direct attribution computed with a
      30-day lookback window by the dbt-ga4 package.
    columns:
      - name: session_partition_date
        tests: [not_null]
      - name: sessions
        tests: [not_null]
  - name: fct_newsroom__subscription_last_touch
    description: >
      Last-touch attribution for subscriptions: one row per subscriber — the
      last article read in the 7 days before their subscription date (with
      reader state at that read), plus the purchase session (last session
      on/before the subscription date) with platform, device, geo and
      first-click session traffic source. Subscription moment = CRM
      registration_date (no explicit subscribe event exists in GA4).
    columns:
      - name: user_id
        tests:
          - not_null
          - unique
      - name: subscription_date
        tests: [not_null]
      - name: subscription_tier
        tests: [not_null]
      - name: last_article_reader_state
        tests:
          - accepted_values:
              values: ['registered', 'anonymous']