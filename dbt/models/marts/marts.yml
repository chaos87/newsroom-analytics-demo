version: 2

models:
  - name: fct_newsroom__articles_daily
    description: >
      Daily article performance: GA4 page views, users, scroll, video, social and
      engagement metrics per article, joined to the CMS export (title, section,
      author). One row per (event_date_dt, article_id).
    columns:
      - name: event_date_dt
        tests: [not_null]
      - name: article_id
        tests: [not_null]
      - name: page_views
        tests: [not_null]
  - name: fct_newsroom__articles_daily_by_reader_type
    description: >
      Daily article performance split by reader type — subscriber /
      registered non-subscriber / anonymous — classified from the GA4 user_id
      on each event joined to the CRM export, churn-aware as of the event
      date (subscription_date ≤ event and churn_date null or later).
      Subscribers are further split by
      subscription tier ('n/a' for registered / anonymous). One row per
      (event_date_dt, article_id, reader_type, subscription_tier).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - event_date_dt
            - article_id
            - reader_type
            - subscription_tier
    columns:
      - name: event_date_dt
        tests: [not_null]
      - name: article_id
        tests: [not_null]
      - name: reader_type
        tests:
          - not_null
          - accepted_values:
              values: ['subscriber', 'registered', 'anonymous']
      - name: subscription_tier
        tests: [not_null]
      - name: page_views
        tests: [not_null]
  - name: fct_newsroom__traffic_sources_daily
    description: >
      Daily sessions by acquisition channel: GA4 default channel grouping, session
      (first-click) source/medium, and last-non-direct attribution computed with a
      30-day lookback window by the dbt-ga4 package.
    columns:
      - name: session_partition_date
        tests: [not_null]
      - name: sessions
        tests: [not_null]
  - name: fct_newsroom__subscription_last_touch
    description: >
      Last-touch attribution for subscriptions: one row per subscription,
      churned subscribers included (churn_date carried through — a cancelled
      subscription is still a conversion that happened). Driven
      by the GA4 `subscribe` paywall conversion event when present — exact
      subscription timestamp, the paywall article, the purchase session (the
      session containing the subscribe event) with platform, device, geo and
      first-click session traffic source, plus the last article read within
      7 days before converting (with reader state at that read). Falls back
      to CRM dates when no subscribe event exists (subscription_source =
      'crm_only'; subscription_date coalesces the CRM subscription date with
      registration_date for legacy rows).
    columns:
      - name: user_id
        tests:
          - not_null
          - unique
      - name: subscription_date
        tests: [not_null]
      - name: subscription_tier
        tests: [not_null]
      - name: subscription_source
        tests:
          - accepted_values:
              values: ['subscribe_event', 'crm_only']
      - name: last_article_reader_state
        tests:
          - accepted_values:
              values: ['registered', 'anonymous']
  - name: fct_newsroom__paywall_daily
    description: >
      Daily paywall funnel by article, wall variant and bundle offer: paywall
      impressions and subscribe-CTA clicks served to non-subscribers. One row
      per (event_date_dt, article_id, paywall_type, bundle_offer). Wall
      variants: hard (premium sections, walled on every non-subscriber hit) /
      metered (walled after 3 free article reads per calendar month).
    columns:
      - name: event_date_dt
        tests: [not_null]
      - name: article_id
        tests: [not_null]
      - name: paywall_type
        tests:
          - not_null
          - accepted_values:
              values: ['hard', 'metered']
      - name: bundle_offer
        tests:
          - not_null
          - accepted_values:
              values: ['digital-only', 'basic', 'premium']
      - name: paywall_impressions
        tests: [not_null]
      - name: paywall_clicks
        tests: [not_null]
  - name: fct_newsroom__paywall_sessions_daily
    description: >
      One row per session-day that served at least one paywall impression —
      the exact denominator for Paywall Conversion Rate (New Subscribers ÷
      sessions exposed to the paywall, METRICS.md). Carries the session's
      wall impressions and CTA clicks.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - event_date_dt
            - session_partition_key
    columns:
      - name: event_date_dt
        tests: [not_null]
      - name: session_partition_key
        tests: [not_null]
      - name: paywall_impressions
        tests: [not_null]