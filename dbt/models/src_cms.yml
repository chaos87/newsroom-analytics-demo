version: 2

sources:
  - name: cms
    database: "{{ var('source_project') }}"
    schema: cms
    description: >
      CMS export (articles) and CRM export (registered accounts) — the business
      data that a newsroom joins against GA4 analytics.
    tables:
      - name: articles
        description: Editorial content inventory (one row per published article).
        columns:
          - name: article_id
            tests:
              - unique
          - name: title
          - name: section
          - name: author
          - name: published_at
          - name: word_count
          - name: is_breaking
          - name: has_video
      - name: users
        description: CRM accounts (registered readers), including subscription state.
        columns:
          - name: user_id
            tests:
              - unique
          - name: registration_date
          - name: subscription_date
            description: When the reader subscribed (null for non-subscribers; separate from registration).
          - name: is_subscriber
            description: Active subscription at export snapshot — churn-aware (see churn_date).
          - name: churn_date
            description: When the subscription was cancelled (null = active). Churned subscribers keep subscription_date + churn_date with is_subscriber = false.